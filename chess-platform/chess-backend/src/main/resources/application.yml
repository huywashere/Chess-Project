server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: chess-backend

  # ===== Database =====
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chessdb}
    username: ${DB_USER:chess}
    password: ${DB_PASS:chess}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ===== Flyway =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  # ===== OAuth2 =====
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: email, profile
            redirect-uri: "${app.base-url}/login/oauth2/code/google"

# ===== App Custom Config =====
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-in-production-min-256-bits}
    expiration: 86400000       # 24 hours (ms)
    refresh-expiration: 604800000  # 7 days (ms)

  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8001}
    timeout-seconds: 15
    pool-size: 4

  rust:
    service-url: ${RUST_ENGINE_URL:http://localhost:8002}

  realtime:
    service-url: ${REALTIME_GO_URL:http://localhost:8085}

  game:
    max-concurrent-ai-games: 100
    clock-tick-interval-ms: 1000
    disconnect-grace-period-seconds: 60

# ===== Async Config =====
async:
  ai-task-executor:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 50

# ===== Logging =====
logging:
  level:
    com.chess: DEBUG
    org.springframework.web.socket: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
