name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend-check:
    name: Frontend Lint & Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./chess-platform/chess-frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./chess-platform/chess-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Quality (ESLint)
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend-check:
    name: Backend Build & Verify (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./chess-platform/chess-backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile & Package Jar
        run: mvn -B clean package -DskipTests
